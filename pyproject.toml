[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-graph-foundation"
version = "0.1.0"
description = "Database-first legal graph foundation for future GraphRAG inference"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.18.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
operator-llm = [
  "openai>=1.105.0",
  "anthropic>=0.72.0",
  "langchain-core>=1.0.0",
  "langchain-openai>=1.0.0",
  "langchain-anthropic>=1.0.0",
]
sentence-transformers = [
  "sentence-transformers>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "neo4j: live Neo4j/Aura integration tests",
  "embedding: live local embedding endpoint integration tests",
  "smoke: operator smoke tests",
]

[tool.setuptools.packages.find]
where = ["src"]
